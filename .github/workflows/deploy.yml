# GitHub Pages deployment for the D-6A drill core JupyterBook
#
# SETUP (one time): Settings > Pages > set Source to "GitHub Actions"
#
# Builds the site with mystmd (JupyterBook v2), executing the notebooks so the
# figures are generated from the CSVs in the repository at build time.

name: Deploy JupyterBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install "jupyter-book>=2.0" "mystmd>=1.10" numpy pandas matplotlib pystrat ipykernel

      - name: Build the book
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          jupyter book build --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
